<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cliente CORS</title><style>body{font:18px 'Segoe UI',sans-serif;max-width:850px;margin:60px auto;padding:20px;background:#f4f7f8;color:#173b45}button{border:0;border-radius:8px;padding:14px;background:#087f75;color:white;font:inherit}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;border:1px solid #ddd;border-radius:12px;padding:22px;font-size:15px}</style><h1>Una página, otro origen</h1><p>Esta página utiliza el puerto 5500. La API utiliza el puerto 3000. Son orígenes diferentes.</p><button id="probar">Consultar API desde este origen</button><pre id="respuesta">Esperando la prueba…</pre><p>CORS regula lo que un navegador puede leer. El token verifica quién puede modificar los productos.</p><script>document.getElementById('probar').onclick=async()=>{try{const r=await fetch('http://127.0.0.1:3000/api/productos');document.getElementById('respuesta').textContent=JSON.stringify(await r.json(),null,2)}catch(e){document.getElementById('respuesta').textContent='El navegador no pudo leer la respuesta. Abre F12 > Consola. Verifica que la API esté activa y que este origen esté permitido.'}}</script></html>
